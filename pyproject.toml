[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "chunking-strategies-lab"
version = "0.0.1"
description = "Empirical comparison of chunking strategies (fixed-size, recursive, semantic, late-chunking, document-structure-aware) on retrieval quality."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "JT McHorse", email = "jmchorse.tech@gmail.com" }]
keywords = ["llm", "rag", "chunking", "retrieval", "embeddings"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

# Corpus + queries + the Embedder protocol have zero runtime deps. The
# real sentence-transformers embedder ships behind an optional extra
# (D-003) so CI doesn't download model weights on every run.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  # Powers tests/test_workflows_yaml_parseable.py (#39), the inverse
  # safety net for the 21-day silent CI outage closed in portfolio-ops#27.
  "pyyaml>=6.0",
  # Stubs for the above, so the three workflow-parsing tests type-check once
  # `tests/` entered the mypy gate (#174, D-015). The alternative — a
  # `module = "yaml.*"` override with `ignore_missing_imports` — is silencing,
  # which D-013's posture rules out; and there is nothing to annotate at the
  # call sites, because the untyped thing is the library, not our code.
  # Unpinned like every other dev dep here: a stub-only floor pinned tighter
  # than the library it describes is its own drift risk.
  "types-PyYAML>=6.0",
  # Powers tests/test_mypy_clean.py and the CI lint step (#164, D-013).
  "mypy>=1.10",
]
sbert = [
  "sentence-transformers>=3.0",
  "numpy>=1.26",
]
# Optional extra for the comparison notebook (#4). The matrix runner
# itself is dep-free; only the notebook needs matplotlib + jupyter.
# Parallels D-003's `[sbert]` pattern — opt-in.
notebook = [
  "matplotlib>=3.8",
  "jupyter>=1.0",
  "nbformat>=5.0",
]

[project.urls]
Repository = "https://github.com/jt-mchorse/chunking-strategies-lab"
Issues    = "https://github.com/jt-mchorse/chunking-strategies-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["chunking_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-ra -q"

[tool.mypy]
# Non-strict baseline gate (#164, D-013; mirrors llm-eval-harness D-016 and
# llm-cost-optimizer D-014). This repo's annotations were already there and
# nothing machine-checked them, which is the "latent green" class — correct
# today, with nothing to tell us when it stopped being. #164 surfaced two
# `no-redef` errors that had gone unnoticed precisely because no gate ran.
#
# Covers the package and `scripts/` (#165, D-014 amending D-013's scope).
# `scripts/run_matrix.py` writes `results/*.json`, which the README table and
# the notebook are derived from, so it is not a throwaway.
#
# It used to be package-only because `mypy chunking_lab scripts` failed before
# checking anything: "Source file found twice under different module names:
# `run_matrix` and `scripts.run_matrix`". That was a true report, not a layout
# quirk -- `tests/` really did import the file both ways, producing two module
# objects from one file in one interpreter, so a `monkeypatch.setattr` on one
# could not reach the other. `explicit_package_bases` + `mypy_path` fix the
# *mapping* (one file, one module name, rooted at the repo), and #165 fixed the
# *cause* by normalizing the imports; neither alone would have been enough.
#
# `tests/` joined the gate in #174 (D-015). D-014 left it out because it
# carried a dependency change -- the three workflow-parsing tests need
# `types-PyYAML` -- and because two of its errors needed reading as possible
# test bugs before being annotated away. Both are settled now, so all three
# directories that ship code are checked by a bare `mypy`.
#
# No blanket `ignore_missing_imports`, so a typo'd import still surfaces. The
# only external import in the package is the optional `sentence_transformers`
# (D-003's `[sbert]` extra), handled by the override below rather than by an
# inline `# type: ignore` — with `warn_unused_ignores` on, an inline ignore
# would itself become an error the moment someone installs the extra.
python_version = "3.11"
files = ["chunking_lab", "scripts", "tests"]
# Root the package base at the repo so `scripts/run_matrix.py` maps to
# `scripts.run_matrix` -- the name the test suite imports it by -- rather than
# ambiguously to both that and bare `run_matrix`. Same mechanism now carries
# `notebooks/_build_notebook.py` -> `notebooks._build_notebook` (#174), which
# the suite reached by a bare name after a `sys.path` insert until this change.
mypy_path = "."
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

# Same treatment, same reason, found by CI rather than by me (#174).
# `tests/test_notebook.py` guards matplotlib at *runtime* with
# `pytest.importorskip("matplotlib")` and then does a static
# `import matplotlib.pyplot as plt` on the next line. mypy does not know what
# `importorskip` means, so it resolves that import statically and fails wherever
# the `[notebook]` extra is absent — which is CI, and which is not my laptop.
# Bringing `tests/` into the gate is what first pointed the checker at it.
#
# An inline `# type: ignore` is the wrong instrument here for the reason the
# `sentence_transformers` note above already gives: with `warn_unused_ignores`
# on it would be *unused* on a machine that has the extra and *required* on one
# that does not, so it cannot be right in both places at once.
[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.ruff]
# ruff 0.16.1 extended `ruff format` to Python code blocks inside Markdown.
# CI installs ruff unpinned (`pip install -e '.[dev]'`), so the tool's scope
# widened overnight and `ruff format --check .` started failing on committed
# Markdown that had never been in scope — with nothing here changed (#142).
# This repo's lint contract has always been "format Python source"; prose is
# not Python source. Re-state the scope the config always meant.
extend-exclude = ["*.md"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]
ignore = ["E501"]
