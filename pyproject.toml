[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "chunking-strategies-lab"
version = "0.0.1"
description = "Empirical comparison of chunking strategies (fixed-size, recursive, semantic, late-chunking, document-structure-aware) on retrieval quality."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "JT McHorse", email = "jmchorse.tech@gmail.com" }]
keywords = ["llm", "rag", "chunking", "retrieval", "embeddings"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

# Corpus + queries + the Embedder protocol have zero runtime deps. The
# real sentence-transformers embedder ships behind an optional extra
# (D-003) so CI doesn't download model weights on every run.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  # Powers tests/test_workflows_yaml_parseable.py (#39), the inverse
  # safety net for the 21-day silent CI outage closed in portfolio-ops#27.
  "pyyaml>=6.0",
  # Powers tests/test_mypy_clean.py and the CI lint step (#164, D-013).
  "mypy>=1.10",
]
sbert = [
  "sentence-transformers>=3.0",
  "numpy>=1.26",
]
# Optional extra for the comparison notebook (#4). The matrix runner
# itself is dep-free; only the notebook needs matplotlib + jupyter.
# Parallels D-003's `[sbert]` pattern — opt-in.
notebook = [
  "matplotlib>=3.8",
  "jupyter>=1.0",
  "nbformat>=5.0",
]

[project.urls]
Repository = "https://github.com/jt-mchorse/chunking-strategies-lab"
Issues    = "https://github.com/jt-mchorse/chunking-strategies-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["chunking_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-ra -q"

[tool.mypy]
# Non-strict baseline gate (#164, D-013; mirrors llm-eval-harness D-016 and
# llm-cost-optimizer D-014). This repo's annotations were already there and
# nothing machine-checked them, which is the "latent green" class — correct
# today, with nothing to tell us when it stopped being. #164 surfaced two
# `no-redef` errors that had gone unnoticed precisely because no gate ran.
#
# Scoped to the package. `mypy chunking_lab scripts tests` fails before
# checking anything with `Source file found twice under different module
# names: "run_matrix" and "scripts.run_matrix"`, which wants an `__init__.py`
# or `--explicit-package-bases` decision of its own; tracked separately rather
# than silently papered over here.
#
# No blanket `ignore_missing_imports`, so a typo'd import still surfaces. The
# only external import in the package is the optional `sentence_transformers`
# (D-003's `[sbert]` extra), handled by the override below rather than by an
# inline `# type: ignore` — with `warn_unused_ignores` on, an inline ignore
# would itself become an error the moment someone installs the extra.
python_version = "3.11"
files = ["chunking_lab"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.ruff]
# ruff 0.16.1 extended `ruff format` to Python code blocks inside Markdown.
# CI installs ruff unpinned (`pip install -e '.[dev]'`), so the tool's scope
# widened overnight and `ruff format --check .` started failing on committed
# Markdown that had never been in scope — with nothing here changed (#142).
# This repo's lint contract has always been "format Python source"; prose is
# not Python source. Re-state the scope the config always meant.
extend-exclude = ["*.md"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]
ignore = ["E501"]
